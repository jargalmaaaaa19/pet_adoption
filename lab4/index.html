<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Үрчлүүлэх тэжээвэр амьтдын зарыг төрөл, нас, байршлаар шүүх демо."
    >
    <title>Үрчилье — тэжээвэр амьтдаа олоорой</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #18332c;
        background: #f5f7f2;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --green: #276749;
        --green-dark: #1e5039;
        --muted: #66756d;
        --border: #dce5dc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
      }

      button,
      input,
      select {
        font: inherit;
      }

      .page-shell {
        width: min(1120px, calc(100% - 40px));
        margin: 0 auto;
      }

      .site-header {
        padding: 22px 0;
        background: #fff;
        border-bottom: 1px solid var(--border);
      }

      .brand {
        color: var(--green-dark);
        font-size: 1.3rem;
        font-weight: 800;
        text-decoration: none;
      }

      .hero {
        padding: 56px 0 34px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--green);
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 680px;
        margin: 0;
        font-size: clamp(2rem, 5vw, 3.5rem);
        line-height: 1.08;
      }

      .hero-copy {
        max-width: 620px;
        margin: 16px 0 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.65;
      }

      .demo-note {
        margin-top: 24px;
        padding: 12px 16px;
        border: 1px solid #ead9a8;
        border-radius: 12px;
        background: #fff9e9;
        color: #69521c;
        font-size: 0.9rem;
        line-height: 1.5;
      }

      .filter-panel {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        align-items: end;
        padding: 22px;
        border: 1px solid var(--border);
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 12px 32px rgb(30 80 57 / 6%);
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field label {
        font-size: 0.84rem;
        font-weight: 700;
      }

      .field input,
      .field select {
        width: 100%;
        min-height: 46px;
        padding: 10px 12px;
        border: 1px solid #cbd7cd;
        border-radius: 10px;
        background: #fff;
        color: inherit;
      }

      .field input:focus,
      .field select:focus,
      button:focus-visible {
        outline: 3px solid #a9d7b9;
        outline-offset: 2px;
      }

      .age-fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .reset-button {
        min-height: 46px;
        padding: 10px 16px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #f7faf7;
        color: var(--green-dark);
        font-weight: 700;
        cursor: pointer;
      }

      .reset-button:hover {
        background: #eaf3ec;
      }

      .listings-section {
        padding: 38px 0 72px;
      }

      .results-heading {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        margin-bottom: 18px;
      }

      h2 {
        margin: 0;
        font-size: 1.45rem;
      }

      .result-count {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .pet-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .pet-card {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 8px 24px rgb(30 80 57 / 5%);
      }

      .pet-card-top {
        display: flex;
        min-height: 126px;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #e9f3e8, #f9edda);
        font-size: 4rem;
      }

      .pet-card-body {
        padding: 18px;
      }

      .pet-card-title {
        margin: 0;
        font-size: 1.2rem;
      }

      .pet-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 12px 0;
      }

      .pet-tag {
        padding: 5px 9px;
        border-radius: 999px;
        background: #eef5ef;
        color: var(--green-dark);
        font-size: 0.8rem;
        font-weight: 700;
      }

      .pet-location,
      .pet-description,
      .pet-detail {
        margin: 8px 0 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .pet-listing {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid var(--border);
      }

      .listing-badge {
        padding: 6px 10px;
        border-radius: 999px;
        background: #eef5ef;
        color: var(--green-dark);
        font-size: 0.82rem;
        font-weight: 700;
      }

      .listing-badge.sale {
        background: #fff2d9;
        color: #79551b;
      }

      .pet-price {
        color: var(--green-dark);
        font-size: 1.05rem;
        font-weight: 800;
        text-align: right;
      }

      .empty-state {
        grid-column: 1 / -1;
        padding: 48px 20px;
        border: 1px dashed #b9c9bc;
        border-radius: 16px;
        background: #fff;
        text-align: center;
      }

      .empty-state h3 {
        margin: 0 0 8px;
        font-size: 1.25rem;
      }

      .empty-state p {
        margin: 0;
        color: var(--muted);
      }

      @media (max-width: 900px) {
        .filter-panel {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .pet-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 560px) {
        .page-shell {
          width: min(100% - 28px, 1120px);
        }

        .hero {
          padding-top: 38px;
        }

        .filter-panel,
        .pet-grid {
          grid-template-columns: 1fr;
        }

        .results-heading {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="page-shell">
        <a class="brand" href="#" aria-label="Үрчилье нүүр хуудас">🐾 Үрчилье</a>
      </div>
    </header>

    <main class="page-shell">
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">Шинэ найзаа олоорой</p>
        <h1 id="page-title">Танд тохирох тэжээвэр амьтнаа хай</h1>
        <p class="hero-copy">
          Амьтны төрөл, үүлдэр, нас болон байршлаар хайж, зар бүрийн гарал
          үүсэл, үрчлүүлэх эсвэл худалдах нөхцөлийг хараарай.
        </p>
        <p class="demo-note">
          Энэ хуудас нь ажиллагааг харуулах демо бөгөөд доорх жишээ зарууд бодит
          зар биш.
        </p>
      </section>

      <form class="filter-panel" id="pet-filters">
        <div class="field">
          <label for="animal-type">Амьтны төрөл</label>
          <select id="animal-type" name="type">
            <option value="">Бүх төрөл</option>
            <option value="Dog">Нохой</option>
            <option value="Cat">Муур</option>
            <option value="Rabbit">Туулай</option>
          </select>
        </div>

        <div class="field">
          <label for="min-age">Нас (жил)</label>
          <div class="age-fields">
            <input
              id="min-age"
              name="minAge"
              type="number"
              min="0"
              step="1"
              placeholder="Доод нас"
              aria-label="Насны доод хязгаар"
            >
            <input
              id="max-age"
              name="maxAge"
              type="number"
              min="0"
              step="1"
              placeholder="Дээд нас"
              aria-label="Насны дээд хязгаар"
            >
          </div>
        </div>

        <div class="field">
          <label for="location">Байршил</label>
          <input
            id="location"
            name="location"
            type="search"
            placeholder="Жишээ нь: Улаанбаатар"
            autocomplete="address-level1"
          >
        </div>

        <div class="field">
          <label for="breed">Үүлдэр</label>
          <input
            id="breed"
            name="breed"
            type="search"
            placeholder="Жишээ нь: Shorthair"
          >
        </div>

        <div class="field">
          <label for="listing-type">Зарын төрөл</label>
          <select id="listing-type" name="listingType">
            <option value="">Бүх зар</option>
            <option value="adoption">Үрчлүүлнэ</option>
            <option value="sale">Худалдаална</option>
          </select>
        </div>

        <button class="reset-button" type="reset">Шүүлтүүр цэвэрлэх</button>
      </form>

      <section class="listings-section" aria-labelledby="listings-title">
        <div class="results-heading">
          <h2 id="listings-title">Үрчлүүлэх зарууд</h2>
          <p class="result-count" id="result-count" aria-live="polite"></p>
        </div>
        <div class="pet-grid" id="pet-list" aria-live="polite"></div>
      </section>
    </main>

    <script src="./petFilters.js"></script>
    <script>
      const demoPets = [
        {
          id: 1,
          name: 'Бороо',
          type: 'Dog',
          breed: 'Монголын эрлийз',
          age: 2,
          location: 'Улаанбаатар',
          origin: 'Найзынхаа асрамжаас',
          listingType: 'adoption',
          description: 'Найрсаг, тоглох дуртай. Шинэ гэр бүлээ хүлээж байна.',
        },
        {
          id: 2,
          name: 'Сондор',
          type: 'Cat',
          breed: 'Британийн богино үст',
          age: 1,
          location: 'Дархан',
          origin: 'Гэрийн үржүүлгээс',
          listingType: 'sale',
          price: 450000,
          description: 'Тайван зантай, гэрт дассан өхөөрдөм муур.',
        },
        {
          id: 3,
          name: 'Хөөрхөн',
          type: 'Rabbit',
          breed: 'Нидерланд одой',
          age: 3,
          location: 'Улаанбаатар',
          origin: 'Асрамжийн төвөөс',
          listingType: 'adoption',
          description: 'Зөөлөн үстэй, арчилгаа сайтай туулай.',
        },
        {
          id: 4,
          name: 'Цасхан',
          type: 'Dog',
          breed: 'Самоед',
          age: 5,
          location: 'Эрдэнэт',
          origin: 'Эзэн нь нүүх болсон тул',
          listingType: 'adoption',
          description: 'Ухаалаг, алхах дуртай, нас бие гүйцсэн нохой.',
        },
        {
          id: 5,
          name: 'Мишээл',
          type: 'Cat',
          breed: 'Шотланд нугалаа чихт',
          age: 4,
          location: 'Улаанбаатар',
          origin: 'Сайн дурын асрагчаас',
          listingType: 'sale',
          price: 600000,
          description: 'Хүмүүстэй хурдан дасдаг, дөлгөөн муур.',
        },
        {
          id: 6,
          name: 'Азтай',
          type: 'Dog',
          breed: 'Монголын эрлийз',
          age: 1,
          location: 'Дархан',
          origin: 'Гудамжнаас олж аварсан',
          listingType: 'adoption',
          description: 'Эрч хүчтэй гөлөг, хамтдаа өсөх эзнээ хайж байна.',
        },
      ];

      const filterForm = document.querySelector('#pet-filters');
      const petList = document.querySelector('#pet-list');
      const resultCount = document.querySelector('#result-count');

      function createPetCard(pet) {
        const card = document.createElement('article');
        card.className = 'pet-card';

        const illustration = document.createElement('div');
        illustration.className = 'pet-card-top';
        illustration.setAttribute('aria-hidden', 'true');
        illustration.textContent =
          pet.type === 'Dog' ? '🐶' : pet.type === 'Cat' ? '🐱' : '🐰';

        const body = document.createElement('div');
        body.className = 'pet-card-body';

        const title = document.createElement('h3');
        title.className = 'pet-card-title';
        title.textContent = pet.name;

        const tags = document.createElement('div');
        tags.className = 'pet-meta';

        const typeTag = document.createElement('span');
        typeTag.className = 'pet-tag';
        typeTag.textContent =
          pet.type === 'Dog' ? 'Нохой' : pet.type === 'Cat' ? 'Муур' : 'Туулай';

        const ageTag = document.createElement('span');
        ageTag.className = 'pet-tag';
        ageTag.textContent = `${pet.age} настай`;

        const breed = document.createElement('p');
        breed.className = 'pet-detail';
        breed.textContent = `Үүлдэр: ${pet.breed}`;

        const location = document.createElement('p');
        location.className = 'pet-location';
        location.textContent = `📍 ${pet.location}`;

        const origin = document.createElement('p');
        origin.className = 'pet-detail';
        origin.textContent = `Гарал үүсэл: ${pet.origin}`;

        const description = document.createElement('p');
        description.className = 'pet-description';
        description.textContent = pet.description;

        const listing = document.createElement('div');
        listing.className = 'pet-listing';

        const listingBadge = document.createElement('span');
        listingBadge.className = 'listing-badge';
        listingBadge.textContent =
          pet.listingType === 'sale' ? 'Худалдаална' : 'Үрчлүүлнэ';

        listing.append(listingBadge);
        if (
          pet.listingType === 'sale' &&
          Number.isFinite(pet.price) &&
          pet.price >= 0
        ) {
          listingBadge.classList.add('sale');
          const price = document.createElement('span');
          price.className = 'pet-price';
          price.textContent = `${new Intl.NumberFormat('mn-MN').format(pet.price)} ₮`;
          listing.append(price);
        }

        tags.append(typeTag, ageTag);
        body.append(title, tags, breed, location, origin, description, listing);
        card.append(illustration, body);
        return card;
      }

      function renderPets() {
        const filters = Object.fromEntries(new FormData(filterForm).entries());
        const matchingPets = PetFilters.filterPets(demoPets, filters);

        resultCount.textContent = `${matchingPets.length} зар олдлоо`;
        petList.replaceChildren();

        if (matchingPets.length === 0) {
          const emptyState = document.createElement('div');
          emptyState.className = 'empty-state';

          const title = document.createElement('h3');
          title.textContent = 'No pets found';

          const message = document.createElement('p');
          message.textContent =
            'Таны сонгосон нөхцөлд тохирох зар алга байна. Шүүлтүүрээ өөрчлөөд үзээрэй.';

          emptyState.append(title, message);
          petList.append(emptyState);
          return;
        }

        petList.append(...matchingPets.map(createPetCard));
      }

      filterForm.addEventListener('input', renderPets);
      filterForm.addEventListener('change', renderPets);
      filterForm.addEventListener('reset', () => {
        window.requestAnimationFrame(renderPets);
      });

      renderPets();
    </script>
  </body>
</html>
